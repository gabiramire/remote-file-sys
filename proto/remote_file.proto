syntax = "proto3";
package remotefs;

option java_package = "remotefs";
option java_multiple_files = true;

// Serviço: sistema de arquivos remoto básico
service RemoteFileSystem {
  rpc Abre     (OpenRequest)  returns (OpenResponse);
  rpc Le       (ReadRequest)  returns (ReadResponse);
  rpc Escreve  (WriteRequest) returns (WriteResponse);
  rpc Fecha    (CloseRequest) returns (CloseResponse);
}

// ---------- Mensagens ----------

message OpenRequest {
  string nomeArquivo = 1;  // caminho relativo sob o root do servidor
}

message OpenResponse {
  int32 codigoErro = 1;    // 0 ok, <0 erro
  int32 descritor  = 2;    // id interno do arquivo no servidor
}

message ReadRequest {
  int32 descritor = 1;
  int32 posicao   = 2;     // offset
  int32 tamanho   = 3;     // bytes desejados
}

message ReadResponse {
  int32 codigoErro = 1;
  bytes conteudo   = 2;    // pode vir menor que 'tamanho' (EOF)
  int32 versao     = 3;    // versão atual do arquivo (coerência de cache)
}

message WriteRequest {
  int32 descritor = 1;
  int32 posicao   = 2;
  bytes conteudo  = 3;
}

message WriteResponse {
  int32 codigoErro    = 1;
  int32 bytesEscritos = 2;
  int32 versao        = 3; // nova versão após a escrita
}

message CloseRequest {
  int32 descritor = 1;
}

message CloseResponse {
  int32 codigoErro = 1;
}
